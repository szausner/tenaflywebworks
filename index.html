<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FocusFlow | Todo + Calendar Organizer</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef3ff;
      --text: #14213d;
      --muted: #5b6478;
      --border: #d9deeb;
      --primary: #2f6df6;
      --primary-soft: #dfe8ff;
      --danger: #d93a45;
      --high: #e04747;
      --med: #e59c2e;
      --low: #2f9b51;
      --radius: 14px;
      --shadow: 0 8px 28px rgba(20, 33, 61, 0.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    h1, h2, h3 { margin: 0; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sub { color: var(--muted); margin-top: 6px; }

    .layout {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .form-grid .full { grid-column: 1 / -1; }

    label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 5px; }

    input, select, textarea, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    textarea { min-height: 70px; resize: vertical; }

    .btn {
      cursor: pointer;
      font-weight: 700;
      border: none;
      background: var(--primary);
      color: #fff;
    }

    .btn.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 10px;
      background: #fff;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .priority-stack {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .todo-item {
      border: 1px solid var(--border);
      border-left: 5px solid var(--primary);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 10px;
      background: #fff;
    }

    .todo-item.high { border-left-color: var(--high); }
    .todo-item.medium { border-left-color: var(--med); }
    .todo-item.low { border-left-color: var(--low); }
    .todo-item.done { opacity: 0.65; }

    .todo-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: start;
    }

    .todo-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .todo-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .calendar-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .weekday, .day {
      border: 1px solid var(--border);
      border-radius: 10px;
      min-height: 72px;
      padding: 6px;
      background: #fff;
      font-size: 12px;
    }

    .weekday {
      min-height: unset;
      text-align: center;
      font-weight: 700;
      background: var(--surface-2);
    }

    .day.muted { opacity: 0.35; }
    .day.today { outline: 2px solid var(--primary); }
    .day.selected { background: var(--primary-soft); }

    .day-number { font-weight: 700; margin-bottom: 4px; }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      margin-right: 4px;
      vertical-align: middle;
    }

    .dot.high { background: var(--high); }
    .dot.medium { background: var(--med); }
    .dot.low { background: var(--low); }

    .empty { color: var(--muted); font-size: 14px; padding: 8px; }

    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="header">
        <div>
          <h1>FocusFlow Planner</h1>
          <p class="sub">Organize todos, categorize work, and manage your calendar in one place.</p>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Top Priority (Sorted by Priority + Due Date)</h2>
      <div id="topPriority" class="priority-stack"></div>
    </section>

    <section class="layout">
      <div class="card">
        <h2>Add Todo</h2>
        <form id="todoForm" class="form-grid">
          <div class="full">
            <label for="title">Title</label>
            <input id="title" name="title" required placeholder="e.g., Prepare budget update" />
          </div>
          <div>
            <label for="category">Category</label>
            <select id="category" name="category">
              <option>Work</option>
              <option>Personal</option>
              <option>Health</option>
              <option>Errands</option>
              <option>Learning</option>
            </select>
          </div>
          <div>
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div>
            <label for="dueDate">Due date</label>
            <input id="dueDate" name="dueDate" type="date" required />
          </div>
          <div>
            <label for="dueTime">Due time (optional)</label>
            <input id="dueTime" name="dueTime" type="time" />
          </div>
          <div class="full">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" placeholder="Extra details"></textarea>
          </div>
          <div class="full">
            <button class="btn" type="submit">Add Todo</button>
          </div>
        </form>

        <div class="toolbar">
          <select id="categoryFilter" aria-label="Filter category">
            <option value="all">All Categories</option>
          </select>
          <select id="statusFilter" aria-label="Filter status">
            <option value="all">All Statuses</option>
            <option value="open">Open</option>
            <option value="done">Completed</option>
          </select>
          <button id="clearCompleted" class="btn secondary" type="button">Clear Completed</button>
        </div>

        <h3 style="margin-top:14px;">All Todos</h3>
        <div id="todoList" class="priority-stack"></div>
      </div>

      <aside class="card">
        <h2>Integrated Calendar</h2>
        <div class="calendar-head">
          <button id="prevMonth" class="btn secondary" type="button">◀</button>
          <h3 id="monthLabel"></h3>
          <button id="nextMonth" class="btn secondary" type="button">▶</button>
        </div>
        <div id="calendar" class="calendar-grid"></div>
        <h3 style="margin-top:14px;">Todos on selected day</h3>
        <div id="selectedDayTodos" class="priority-stack"></div>
      </aside>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'focusflow.todos.v1';
    const priorityRank = { high: 0, medium: 1, low: 2 };

    const form = document.getElementById('todoForm');
    const todoListEl = document.getElementById('todoList');
    const topPriorityEl = document.getElementById('topPriority');
    const categoryFilterEl = document.getElementById('categoryFilter');
    const statusFilterEl = document.getElementById('statusFilter');
    const clearCompletedBtn = document.getElementById('clearCompleted');
    const calendarEl = document.getElementById('calendar');
    const monthLabelEl = document.getElementById('monthLabel');
    const selectedDayTodosEl = document.getElementById('selectedDayTodos');
    const prevMonthBtn = document.getElementById('prevMonth');
    const nextMonthBtn = document.getElementById('nextMonth');

    let todos = loadTodos();
    let selectedDate = new Date().toISOString().slice(0, 10);
    let visibleMonth = new Date();
    visibleMonth.setDate(1);

    function loadTodos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : seedTodos();
      } catch {
        return seedTodos();
      }
    }

    function seedTodos() {
      const today = new Date();
      const in2 = new Date(today); in2.setDate(today.getDate() + 2);
      const in5 = new Date(today); in5.setDate(today.getDate() + 5);
      const data = [
        { id: crypto.randomUUID(), title: 'Finalize project roadmap', category: 'Work', priority: 'high', dueDate: toISO(in2), dueTime: '10:30', notes: 'Review with team lead', done: false },
        { id: crypto.randomUUID(), title: 'Book dentist appointment', category: 'Personal', priority: 'medium', dueDate: toISO(in5), dueTime: '', notes: '', done: false },
        { id: crypto.randomUUID(), title: '30-minute workout', category: 'Health', priority: 'low', dueDate: toISO(today), dueTime: '18:00', notes: '', done: false }
      ];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return data;
    }

    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function toISO(date) {
      return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    }

    function dueStamp(todo) {
      return `${todo.dueDate}T${todo.dueTime || '23:59'}`;
    }

    function sortedTodos(items) {
      return [...items].sort((a, b) => {
        const priorityDiff = priorityRank[a.priority] - priorityRank[b.priority];
        if (priorityDiff !== 0) return priorityDiff;
        return dueStamp(a).localeCompare(dueStamp(b));
      });
    }

    function renderCategoryFilter() {
      const categories = Array.from(new Set(todos.map(t => t.category))).sort();
      const current = categoryFilterEl.value || 'all';
      categoryFilterEl.innerHTML = '<option value="all">All Categories</option>' +
        categories.map(c => `<option value="${c}">${c}</option>`).join('');
      categoryFilterEl.value = categories.includes(current) ? current : 'all';
    }

    function renderTopPriority() {
      const open = todos.filter(t => !t.done);
      const top = sortedTodos(open).slice(0, 5);
      if (!top.length) {
        topPriorityEl.innerHTML = '<p class="empty">No open tasks. Nice work.</p>';
        return;
      }
      topPriorityEl.innerHTML = top.map(todoCardHtml).join('');
      bindTodoButtons(topPriorityEl);
    }

    function renderTodos() {
      const cat = categoryFilterEl.value;
      const status = statusFilterEl.value;
      let filtered = [...todos];
      if (cat !== 'all') filtered = filtered.filter(t => t.category === cat);
      if (status === 'open') filtered = filtered.filter(t => !t.done);
      if (status === 'done') filtered = filtered.filter(t => t.done);

      const sorted = sortedTodos(filtered);
      if (!sorted.length) {
        todoListEl.innerHTML = '<p class="empty">No todos match this filter.</p>';
        return;
      }
      todoListEl.innerHTML = sorted.map(todoCardHtml).join('');
      bindTodoButtons(todoListEl);
    }

    function renderCalendar() {
      const y = visibleMonth.getFullYear();
      const m = visibleMonth.getMonth();
      monthLabelEl.textContent = visibleMonth.toLocaleString(undefined, { month: 'long', year: 'numeric' });

      const first = new Date(y, m, 1);
      const startDay = first.getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const prevMonthDays = new Date(y, m, 0).getDate();
      const todayIso = toISO(new Date());

      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']
        .map(day => `<div class="weekday">${day}</div>`).join('');

      let daysHtml = '';
      for (let i = startDay - 1; i >= 0; i--) {
        const dayNum = prevMonthDays - i;
        const date = toISO(new Date(y, m - 1, dayNum));
        daysHtml += dayCellHtml(dayNum, date, true, todayIso);
      }

      for (let dayNum = 1; dayNum <= daysInMonth; dayNum++) {
        const date = toISO(new Date(y, m, dayNum));
        daysHtml += dayCellHtml(dayNum, date, false, todayIso);
      }

      const cellsUsed = startDay + daysInMonth;
      const trailing = (7 - (cellsUsed % 7)) % 7;
      for (let dayNum = 1; dayNum <= trailing; dayNum++) {
        const date = toISO(new Date(y, m + 1, dayNum));
        daysHtml += dayCellHtml(dayNum, date, true, todayIso);
      }

      calendarEl.innerHTML = weekdays + daysHtml;
      calendarEl.querySelectorAll('.day').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedDate = btn.dataset.date;
          renderCalendar();
          renderSelectedDayTodos();
        });
      });
    }

    function dayCellHtml(dayNum, date, muted, todayIso) {
      const dayTodos = sortedTodos(todos.filter(t => t.dueDate === date && !t.done)).slice(0, 2);
      const dots = dayTodos.map(t => `<div><span class="dot ${t.priority}"></span>${escapeHtml(t.title.slice(0, 18))}</div>`).join('');
      const classes = ['day'];
      if (muted) classes.push('muted');
      if (date === todayIso) classes.push('today');
      if (date === selectedDate) classes.push('selected');
      return `
        <button class="${classes.join(' ')}" type="button" data-date="${date}">
          <div class="day-number">${dayNum}</div>
          ${dots}
        </button>
      `;
    }

    function renderSelectedDayTodos() {
      const matches = sortedTodos(todos.filter(t => t.dueDate === selectedDate));
      if (!matches.length) {
        selectedDayTodosEl.innerHTML = `<p class="empty">No todos for ${selectedDate}.</p>`;
        return;
      }
      selectedDayTodosEl.innerHTML = matches.map(todoCardHtml).join('');
      bindTodoButtons(selectedDayTodosEl);
    }

    function todoCardHtml(todo) {
      const dueText = todo.dueTime ? `${todo.dueDate} ${todo.dueTime}` : todo.dueDate;
      return `
        <article class="todo-item ${todo.priority} ${todo.done ? 'done' : ''}">
          <div class="todo-head">
            <strong>${escapeHtml(todo.title)}</strong>
            <span class="chip">${todo.done ? 'Done' : 'Open'}</span>
          </div>
          <div class="todo-meta">
            <span class="chip">${todo.category}</span>
            <span class="chip">${todo.priority}</span>
            <span class="chip">Due: ${dueText}</span>
          </div>
          ${todo.notes ? `<div>${escapeHtml(todo.notes)}</div>` : ''}
          <div class="todo-actions">
            <button class="btn secondary" type="button" data-action="toggle" data-id="${todo.id}">${todo.done ? 'Mark Open' : 'Mark Done'}</button>
            <button class="btn secondary" type="button" data-action="delete" data-id="${todo.id}">Delete</button>
          </div>
        </article>
      `;
    }

    function bindTodoButtons(scope) {
      scope.querySelectorAll('[data-action="toggle"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const todo = todos.find(t => t.id === btn.dataset.id);
          if (!todo) return;
          todo.done = !todo.done;
          saveTodos();
          rerender();
        });
      });
      scope.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', () => {
          todos = todos.filter(t => t.id !== btn.dataset.id);
          saveTodos();
          rerender();
        });
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const data = new FormData(form);
      const todo = {
        id: crypto.randomUUID(),
        title: String(data.get('title')).trim(),
        category: String(data.get('category')).trim() || 'General',
        priority: String(data.get('priority')),
        dueDate: String(data.get('dueDate')),
        dueTime: String(data.get('dueTime') || ''),
        notes: String(data.get('notes') || '').trim(),
        done: false
      };
      if (!todo.title || !todo.dueDate) return;
      todos.push(todo);
      saveTodos();
      form.reset();
      form.priority.value = 'medium';
      rerender();
    });

    categoryFilterEl.addEventListener('change', renderTodos);
    statusFilterEl.addEventListener('change', renderTodos);

    clearCompletedBtn.addEventListener('click', () => {
      todos = todos.filter(t => !t.done);
      saveTodos();
      rerender();
    });

    prevMonthBtn.addEventListener('click', () => {
      visibleMonth.setMonth(visibleMonth.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      visibleMonth.setMonth(visibleMonth.getMonth() + 1);
      renderCalendar();
    });

    function rerender() {
      renderCategoryFilter();
      renderTopPriority();
      renderTodos();
      renderCalendar();
      renderSelectedDayTodos();
    }

    rerender();
  </script>
</body>
</html>
